<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo de Produtos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container py-4">

        <h1 class="text-center mb-4">
            Catálogo de Produtos
        </h1>

        <!-- Busca -->
        <input type="text" id="busca" class="form-control mb-4" placeholder="Buscar produto...">

        <!-- Produtos -->
        <div id="produtos" class="row g-4">

        </div>

        <hr class="my-5">

        <!-- Favoritos -->
        <h2 class="mb-4">
            ⭐ Favoritos
        </h2>

        <hr class="my-5">

        <h2 class="mb-4">
            🛒 Carrinho
        </h2>

        <div id="carrinho" class="row g-4 mb-4">

        </div>

        <button class="btn btn-success" onclick="finalizarCompra()">
            Finalizar Compra
        </button>

        <div id="favoritos" class="row g-4">

        </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JS -->
    <script src="app.js"></script>

</body>

</html>
